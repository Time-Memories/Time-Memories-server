<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Memories Chat Test</title>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>

<h1>Memories Chat Test</h1>

<hr>

<div>
    <h3>연결</h3>

    <input
            type="text"
            id="token"
            placeholder="Access Token"
            style="width: 700px;"
    />

    <br><br>

    <input
            type="number"
            id="roomId"
            value="1"
            placeholder="roomId"
    />

    <button onclick="connect()">연결</button>
    <button onclick="disconnect()">해제</button>
</div>

<hr>

<div>
    <h3>텍스트 메시지</h3>

    <input
            type="text"
            id="content"
            placeholder="메시지 입력"
            style="width: 400px;"
    />

    <button onclick="sendMessage()">전송</button>
</div>

<hr>

<div>
    <h3>이미지 메시지</h3>

    <input
            type="text"
            id="imageKeys"
            placeholder="chat/a.jpg, chat/b.jpg"
            style="width: 400px;"
    />

    <button onclick="sendImageMessage()">이미지 전송</button>
</div>

<hr>

<div>
    <h3>채팅 기록 조회</h3>

    <input
            type="number"
            id="cursor"
            placeholder="cursor"
    />

    <input
            type="number"
            id="size"
            value="20"
            placeholder="size"
    />

    <button onclick="getChats()">조회</button>
</div>

<hr>

<div>
    <h3>채팅 삭제</h3>

    <input
            type="number"
            id="deleteChatId"
            placeholder="chatId"
    />

    <button onclick="deleteChat()">삭제</button>
</div>

<hr>

<button onclick="clearLog()">로그 지우기</button>

<pre
        id="log"
        style="
            height: 500px;
            overflow: auto;
            background: #f5f5f5;
            padding: 10px;
        "
></pre>

<script>

    let stompClient = null;
    let currentRoomId = null;
    let accessToken = null;

    function appendLog(title, data) {
        const log = document.getElementById("log");

        log.textContent +=
            "\n[" + title + "]\n" +
            (typeof data === "string"
                ? data
                : JSON.stringify(data, null, 2))
            + "\n";

        log.scrollTop = log.scrollHeight;
    }

    function connect() {

        accessToken = document.getElementById("token").value;
        currentRoomId = document.getElementById("roomId").value;

        const socket = new SockJS("http://localhost:8080/ws");

        stompClient = Stomp.over(socket);

        const headers = {};

        if (accessToken) {
            headers.Authorization = "Bearer " + accessToken;
        }

        stompClient.connect(
            headers,

            function () {

                appendLog("CONNECTED", "연결 성공");

                stompClient.subscribe(
                    "/topic/rooms/" + currentRoomId,
                    function (message) {
                        appendLog(
                            "MESSAGE",
                            JSON.parse(message.body)
                        );
                    }
                );

                stompClient.subscribe(
                    "/topic/rooms/" + currentRoomId + "/updates",
                    function (message) {
                        appendLog(
                            "UPDATE",
                            JSON.parse(message.body)
                        );
                    }
                );

                stompClient.subscribe(
                    "/user/queue/errors",
                    function (message) {
                        appendLog(
                            "ERROR",
                            JSON.parse(message.body)
                        );
                    }
                );
            },

            function (error) {
                appendLog("CONNECT ERROR", error);
            }
        );
    }

    function disconnect() {

        if (stompClient) {
            stompClient.disconnect(() => {
                appendLog("DISCONNECTED", "연결 종료");
            });
        }
    }

    function sendMessage() {

        const content =
            document.getElementById("content").value;

        stompClient.send(
            "/app/rooms/" + currentRoomId + "/chats",
            {},
            JSON.stringify({
                content: content
            })
        );
    }

    function sendImageMessage() {

        const raw =
            document.getElementById("imageKeys").value;

        const imageKeys = raw
            .split(",")
            .map(v => v.trim())
            .filter(v => v.length > 0);

        stompClient.send(
            "/app/rooms/" + currentRoomId + "/chats/images",
            {},
            JSON.stringify({
                imageKeys: imageKeys
            })
        );
    }

    async function getChats() {

        const cursor =
            document.getElementById("cursor").value;

        const size =
            document.getElementById("size").value || 20;

        let url =
            "http://localhost:8080/api/rooms/"
            + currentRoomId
            + "/chats?size="
            + size;

        if (cursor) {
            url += "&cursor=" + cursor;
        }

        const response = await fetch(
            url,
            {
                headers: {
                    Authorization: "Bearer " + accessToken
                }
            }
        );

        const data = await response.json();

        appendLog("CHAT HISTORY", data);

        if (data.nextCursor) {
            document.getElementById("cursor").value =
                data.nextCursor;
        }
    }

    async function deleteChat() {

        const chatId =
            document.getElementById("deleteChatId").value;

        const response = await fetch(
            "http://localhost:8080/api/rooms/"
            + currentRoomId
            + "/chats/"
            + chatId,
            {
                method: "DELETE",
                headers: {
                    Authorization: "Bearer " + accessToken
                }
            }
        );

        appendLog(
            "DELETE RESULT",
            "status = " + response.status
        );
    }

    function clearLog() {
        document.getElementById("log").textContent = "";
    }

</script>
</body>
</html>
